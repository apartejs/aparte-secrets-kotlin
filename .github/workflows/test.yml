name: test
on: [push, pull_request]

# The equality references hold secret-shaped strings: they live on Hugging Face, not in this repository.
env:
  REFS_URL: https://huggingface.co/apartejs/aparte-secrets/resolve/main/references/references_int8.jsonl

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Reference spans from Hugging Face
        run: curl -fsSL -o references_int8.jsonl "$REFS_URL"
      - name: Tests
        run: APARTE_SECRETS_REFS=$PWD/references_int8.jsonl ./gradlew test
      - name: An app on Kotlin 2.0 compiles against it
        run: |
          ./gradlew publishToMavenLocal
          ./gradlew -p compat-test run

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest Android the library targets, and a recent one
        api-level: [21, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reference spans as test assets
        run: |
          mkdir -p android-test/src/androidTest/assets
          curl -fsSL -o android-test/src/androidTest/assets/references_int8.jsonl "$REFS_URL"
      - name: Tests on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew -p android-test connectedDebugAndroidTest
            adb logcat -d -s AparteSecrets:I
